<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Wasi CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/breakpoints.css" />
  <link rel="stylesheet" href="/marketing/marketing.css" />
  <link rel="stylesheet" href="/design-system.css" />
  <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <header class="site-nav">
    <div class="container">
      <a href="/marketing/index.html" class="nav-logo" aria-label="Wasi home">
          <svg viewBox="0 0 40 28" fill="none" aria-hidden="true"><path d="M3 5c0-2 1.4-3.5 3.5-3.5C14 1.5 19 8 19 15c0 6-3 11-8 11C6 26 3 19 3 5z" fill="#4AC959"/><path d="M37 5c0-2-1.4-3.5-3.5-3.5C26 1.5 21 8 21 15c0 6 3 11 8 11 5 0 8-7 8-21z" fill="#2E9E3B"/></svg>
          <span>Wasi</span>
        </a>
    </div>
  </header>

  <section class="section-tight">
    <div class="container container-narrow simple-page">
      <h1>Reset your password</h1>
      <p id="reset-intro" class="page-lede">Choose a new password for your account.</p>

      <form id="reset-form" class="simple-card">
        <div class="form-group">
          <label class="form-label" for="new-password">New password</label>
          <input type="password" id="new-password" class="form-input" minlength="8" required placeholder="At least 8 characters" />
        </div>
        <div id="reset-error" class="form-error-banner"></div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset password</button>
      </form>

      <div id="reset-success" class="simple-card text-center" style="display:none;">
        <p class="page-lede">Your password has been updated.</p>
        <a href="/index.html" id="reset-success-link" class="btn btn-primary btn-block">Log in</a>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const API_BASE = (['localhost', '127.0.0.1'].includes(location.hostname) && location.port !== '4000')
        ? 'http://localhost:4000'
        : '';
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const isAdmin = params.get('admin') === '1';
      const form = document.getElementById('reset-form');
      const errorEl = document.getElementById('reset-error');

      document.getElementById('reset-success-link').href = isAdmin ? '/admin/index.html' : '/index.html';

      if (!token) {
        document.getElementById('reset-intro').textContent = 'This link is missing a reset token — request a new one from the login screen.';
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.remove('visible');
        const password = document.getElementById('new-password').value;
        const submitBtn = document.getElementById('reset-submit');
        submitBtn.disabled = true;
        try {
          const endpoint = isAdmin ? '/api/admin/auth/reset-password' : '/api/auth/reset-password';
          const res = await fetch(`${API_BASE}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Reset failed');
          form.style.display = 'none';
          document.getElementById('reset-success').style.display = 'block';
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.add('visible');
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
