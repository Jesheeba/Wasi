<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Wasi CRM</title>
  <link rel="stylesheet" href="/marketing/marketing.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="site-nav">
    <div class="container">
      <a href="/marketing/index.html" class="nav-logo">
        <svg width="112" height="34" viewBox="0 0 130 40" fill="none">
          <rect width="130" height="40" rx="8" fill="#43B751" fill-opacity="0.15"/>
          <text x="22" y="27" font-family="'Poppins', sans-serif" font-weight="700" font-size="22" fill="#304742">wasi</text>
          <circle cx="98" cy="18" r="4" fill="#4AC959"/>
        </svg>
      </a>
    </div>
  </header>

  <section class="section-tight">
    <div class="container" style="max-width: 420px;">
      <h1 style="margin-bottom: 0.5rem;">Reset your password</h1>
      <p id="reset-intro" style="color: var(--text-muted); margin-bottom: 1.5rem;">Choose a new password for your account.</p>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="new-password">New password</label>
          <input type="password" id="new-password" class="form-input" minlength="8" required placeholder="At least 8 characters" />
        </div>
        <div id="reset-error" class="banner" style="display:none;color:#B91C1C;background:#FEE2E2;padding:10px 14px;border-radius:8px;margin-bottom:1rem;font-size:0.875rem;"></div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Reset password</button>
      </form>

      <div id="reset-success" style="display:none;text-align:center;">
        <p style="color: var(--text-muted); margin-bottom: 1rem;">Your password has been updated.</p>
        <a href="/index.html" id="reset-success-link" class="btn btn-primary btn-block">Log in</a>
      </div>
    </div>
  </section>

  <script>
    (() => {
      const API_BASE = (['localhost', '127.0.0.1'].includes(location.hostname) && location.port !== '4000')
        ? 'http://localhost:4000'
        : '';
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const isAdmin = params.get('admin') === '1';
      const form = document.getElementById('reset-form');
      const errorEl = document.getElementById('reset-error');

      document.getElementById('reset-success-link').href = isAdmin ? '/admin/index.html' : '/index.html';

      if (!token) {
        document.getElementById('reset-intro').textContent = 'This link is missing a reset token — request a new one from the login screen.';
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';
        const password = document.getElementById('new-password').value;
        const submitBtn = document.getElementById('reset-submit');
        submitBtn.disabled = true;
        try {
          const endpoint = isAdmin ? '/api/admin/auth/reset-password' : '/api/auth/reset-password';
          const res = await fetch(`${API_BASE}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Reset failed');
          form.style.display = 'none';
          document.getElementById('reset-success').style.display = 'block';
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
