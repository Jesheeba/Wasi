<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email — Wasi CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/breakpoints.css" />
  <link rel="stylesheet" href="/marketing/marketing.css" />
  <link rel="stylesheet" href="/design-system.css" />
  <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <header class="site-nav">
    <div class="container">
      <a href="/marketing/index.html" class="nav-logo" aria-label="Wasi home">
          <svg viewBox="0 0 40 28" fill="none" aria-hidden="true"><path d="M3 5c0-2 1.4-3.5 3.5-3.5C14 1.5 19 8 19 15c0 6-3 11-8 11C6 26 3 19 3 5z" fill="#4AC959"/><path d="M37 5c0-2-1.4-3.5-3.5-3.5C26 1.5 21 8 21 15c0 6 3 11 8 11 5 0 8-7 8-21z" fill="#2E9E3B"/></svg>
          <span>Wasi</span>
        </a>
    </div>
  </header>

  <section class="section-tight">
    <div class="container container-narrow simple-page text-center">
      <h1 id="verify-heading">Verifying your email…</h1>
      <p id="verify-message" class="page-lede">One moment.</p>
      <a href="/index.html" class="btn btn-primary btn-block">Go to Wasi CRM</a>
    </div>
  </section>

  <script>
    (() => {
      const API_BASE = (['localhost', '127.0.0.1'].includes(location.hostname) && location.port !== '4000')
        ? 'http://localhost:4000'
        : '';
      const token = new URLSearchParams(location.search).get('token');
      const heading = document.getElementById('verify-heading');
      const message = document.getElementById('verify-message');

      // Success and failure used to look visually identical — plain text,
      // no color-coding — so a failed verification read no differently
      // than a successful one at a glance. Reuses the same real
      // .form-error-banner/.form-info-banner classes the signup wizard
      // already established, instead of leaving this page as the one
      // unstyled outlier.
      function showOutcome(kind, text) {
        message.className = kind === 'error' ? 'form-error-banner visible' : 'form-info-banner visible';
        message.textContent = text;
      }

      if (!token) {
        heading.textContent = 'Missing verification token';
        showOutcome('error', 'This link is incomplete. Request a new verification email from inside the app.');
        return;
      }

      fetch(`${API_BASE}/api/auth/verify-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token }),
      })
        .then(async (res) => {
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Verification failed');
          heading.textContent = 'Email verified';
          showOutcome('info', 'You can now use your account.');
        })
        .catch((err) => {
          heading.textContent = 'Verification failed';
          showOutcome('error', err.message);
        });
    })();
  </script>
</body>
</html>
