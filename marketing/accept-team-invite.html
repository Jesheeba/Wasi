<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accept Team Invite — Wasi CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/breakpoints.css" />
  <link rel="stylesheet" href="/marketing/marketing.css" />
  <link rel="stylesheet" href="/design-system.css" />
  <script src="https://unpkg.com/lucide@1.49.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>

  <header class="site-nav">
    <div class="container">
      <a href="/marketing/index.html" class="nav-logo" aria-label="Wasi home">
          <svg viewBox="0 0 40 28" fill="none" aria-hidden="true"><path d="M3 5c0-2 1.4-3.5 3.5-3.5C14 1.5 19 8 19 15c0 6-3 11-8 11C6 26 3 19 3 5z" fill="#4AC959"/><path d="M37 5c0-2-1.4-3.5-3.5-3.5C26 1.5 21 8 21 15c0 6 3 11 8 11 5 0 8-7 8-21z" fill="#2E9E3B"/></svg>
          <span>Wasi</span>
        </a>
    </div>
  </header>

  <section class="section-tight">
    <div class="container container-narrow simple-page">
      <h1>Set your password</h1>
      <p id="invite-intro" class="page-lede">You've been invited to join a team on Wasi CRM. Choose a password to activate your account.</p>

      <form id="invite-form" class="simple-card">
        <div class="form-group">
          <label class="form-label" for="new-password">Password</label>
          <input type="password" id="new-password" class="form-input" minlength="8" required placeholder="At least 8 characters" />
        </div>
        <div id="invite-error" class="form-error-banner"></div>
        <button type="submit" class="btn btn-primary btn-block" id="invite-submit">Activate account</button>
      </form>

      <div id="invite-success" class="simple-card text-center" style="display:none;">
        <p class="page-lede">Your account is active — taking you in now.</p>
      </div>
    </div>
  </section>

  <script>
    (() => {
      // Same API_BASE snippet as reset-password.html/index.html — not
      // shared via a common file, matching this repo's existing convention
      // of each static page carrying its own copy (no build step to share it).
      const API_BASE = (['localhost', '127.0.0.1'].includes(location.hostname) && location.port !== '4000')
        ? 'http://localhost:4000'
        : '';
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const form = document.getElementById('invite-form');
      const errorEl = document.getElementById('invite-error');

      if (!token) {
        document.getElementById('invite-intro').textContent = 'This invite link is missing a token — ask whoever invited you to resend it.';
        form.style.display = 'none';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.remove('visible');
        const password = document.getElementById('new-password').value;
        const submitBtn = document.getElementById('invite-submit');
        submitBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/auth/team/accept-invite`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, password }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Could not activate this account');

          // Unlike reset-password, this endpoint returns a working JWT
          // directly — auto-login straight into the real app rather than
          // making someone who just set a password type it again immediately.
          localStorage.setItem('client_token', data.token);
          localStorage.setItem('actor_type', 'team_member');
          form.style.display = 'none';
          document.getElementById('invite-success').style.display = 'block';
          setTimeout(() => { window.location.href = '/index.html'; }, 1200);
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.classList.add('visible');
        } finally {
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
