# Deploy path on the VPS: /etc/nginx/sites-enabled/wasi.sirahagents.com
#
# HTTP-only, pre-certbot. This is the file to actually put in place and
# `nginx -t && systemctl reload nginx` BEFORE running certbot — certbot's
# nginx plugin finds this server block by server_name and rewrites it to add
# the 443 block + redirect, the same way it clearly did for
# legal.sirahagents.com (that file's 443 block and the trailing "return 404"
# 80-block are certbot's own output, not something to hand-write).
#
# Domain below is a placeholder following this VPS's existing
# chat/legal/message/nusi.sirahagents.com naming convention — confirm or
# correct before deploying.
#
# One location block, not two like legal.sirahagents.com's /api/ + / split:
# Wasi's Express app (server/src/app.js) serves the API and the static
# frontend from the same process on the same port, so everything proxies to
# 127.0.0.1:4002.
#
# client_max_body_size raised from 25m -> 120m (2026-08-20) for the
# media-header template feature: WhatsApp document headers allow files up to
# 100MB, so the cap needs headroom above that for multipart overhead.
#
# client_body_timeout added at 300s (2026-08-20), previously unset
# (nginx default 60s). This is the directive that actually matters for a
# slow mobile upload of a large video/document — it resets on every chunk
# nginx receives, so it's an inactivity gap, not a total-upload-time limit.
# proxy_read_timeout below governs the separate leg (nginx -> the Express
# app) and was not the real risk for client uploads; left unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name wasi.sirahagents.com;

    client_max_body_size 120m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
